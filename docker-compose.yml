services:
  db:
    image: postgres:16-alpine
    container_name: sami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sami
      POSTGRES_PASSWORD: sami
      POSTGRES_DB: sami
    ports:
      - "5432:5432"
    volumes:
      - sami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sami -d sami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sami_pgdata:
